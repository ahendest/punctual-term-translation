name: checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # The terminology area writes into the store of agentic-translate, its sibling folder.
      - uses: actions/checkout@v4
        with:
          path: punctual-term-translation
      - uses: actions/checkout@v4
        with:
          repository: ahendest/agentic-translate
          path: agentic-translate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild the shared store
        working-directory: agentic-translate
        run: |
          python3 -B tools/knowledge.py --config knowledge/config.json init
          python3 -B tools/knowledge.py --config knowledge/config.json import-terms --input knowledge/knowledge.jsonl
          python3 -B tools/knowledge.py --config knowledge/config.json import-lugat --input knowledge/sources/db_lugat.sql
      - name: Unit tests and store check
        working-directory: punctual-term-translation
        run: |
          env PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
          python3 -B tools/terms.py check
